<div class="office-scene" role="application" aria-label="1973 headquarters office desk">
  <!-- Room / desk atmosphere — interactive props use art from public/office. -->
  <svg
    class="office-scene__art"
    viewBox="0 0 1000 700"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
    focusable="false"
  >
    <defs>
      <linearGradient id="ob-office-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7eb4d4" />
        <stop offset="55%" stop-color="#b7d4e8" />
        <stop offset="100%" stop-color="#d9e6ef" />
      </linearGradient>
      <linearGradient id="ob-office-wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#cfc4b0" />
        <stop offset="100%" stop-color="#b8ab96" />
      </linearGradient>
      <linearGradient id="ob-office-desk" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8a6a48" />
        <stop offset="100%" stop-color="#6b5136" />
      </linearGradient>
      <linearGradient id="ob-office-carpet" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3d5a78" />
        <stop offset="100%" stop-color="#2f4760" />
      </linearGradient>
    </defs>

    <rect x="0" y="0" width="1000" height="700" fill="url(#ob-office-wall)" />
    <path d="M0 560 L1000 560 L1000 700 L0 700 Z" fill="url(#ob-office-carpet)" />

    <rect x="70" y="40" width="860" height="320" fill="#e8e2d6" stroke="#8a7c68" stroke-width="10" />
    <rect x="90" y="58" width="820" height="284" fill="url(#ob-office-sky)" />

    <g fill="#5a6570">
      <rect x="120" y="160" width="90" height="182" />
      <rect x="230" y="130" width="70" height="212" />
      <rect x="320" y="175" width="110" height="167" />
      <rect x="450" y="110" width="80" height="232" />
      <rect x="550" y="155" width="95" height="187" />
      <rect x="670" y="140" width="75" height="202" />
      <rect x="760" y="170" width="120" height="172" />
    </g>
    <g fill="#7a8690" opacity="0.85">
      <rect x="140" y="180" width="12" height="12" />
      <rect x="165" y="180" width="12" height="12" />
      <rect x="140" y="210" width="12" height="12" />
      <rect x="165" y="210" width="12" height="12" />
      <rect x="250" y="150" width="10" height="10" />
      <rect x="270" y="150" width="10" height="10" />
      <rect x="470" y="130" width="10" height="10" />
      <rect x="490" y="130" width="10" height="10" />
      <rect x="780" y="190" width="12" height="12" />
      <rect x="805" y="190" width="12" height="12" />
    </g>

    <line x1="500" y1="58" x2="500" y2="342" stroke="#e8e2d6" stroke-width="8" />
    <line x1="90" y1="200" x2="910" y2="200" stroke="#e8e2d6" stroke-width="6" />

    <g>
      <rect x="100" y="370" width="280" height="10" fill="#7a6548" />
      <rect x="110" y="340" width="18" height="30" fill="#3f5f3c" />
      <rect x="132" y="335" width="18" height="35" fill="#8b3a35" />
      <rect x="154" y="342" width="18" height="28" fill="#2f5f6b" />
      <rect x="176" y="338" width="18" height="32" fill="#8a5a1a" />
      <rect x="220" y="348" width="70" height="22" fill="#6b7a88" rx="2" />
      <ellipse cx="320" cy="355" rx="28" ry="12" fill="#5a5044" />
      <rect x="308" y="330" width="24" height="28" fill="#cfc6b6" />

      <rect x="620" y="370" width="280" height="10" fill="#7a6548" />
      <rect x="640" y="345" width="55" height="25" fill="#4a5568" />
      <path d="M720 365 L780 365 L770 345 L730 345 Z" fill="#6b7a88" />
      <rect x="800" y="340" width="40" height="30" fill="#ebe4d8" stroke="#8a7c68" stroke-width="2" />
      <circle cx="860" cy="355" r="14" fill="#3a4554" />
    </g>

    <g>
      <rect x="40" y="480" width="36" height="40" fill="#6b5136" />
      <ellipse cx="58" cy="470" rx="28" ry="18" fill="#3f5f3c" />
      <ellipse cx="42" cy="455" rx="16" ry="12" fill="#4a6b45" />
      <ellipse cx="74" cy="458" rx="14" ry="11" fill="#355033" />
    </g>

    <path
      d="M40 620 L960 620 L880 430 L120 430 Z"
      fill="url(#ob-office-desk)"
      stroke="#5a4330"
      stroke-width="3"
    />
    <path d="M120 430 L880 430 L860 410 L140 410 Z" fill="#a08058" />
    <path d="M20 700 L980 700 L960 620 L40 620 Z" fill="#5a4330" />

    <g>
      <rect x="95" y="455" width="28" height="10" fill="#8a7c68" rx="2" />
      <path d="M108 455 Q130 400 160 390" fill="none" stroke="#6b6570" stroke-width="6" />
      <path d="M145 375 L175 405 L195 390 L165 360 Z" fill="#c9a227" />
    </g>
  </svg>

  @for (prop of props; track prop.id) {
    <button
      type="button"
      class="office-hotspot office-hotspot--image"
      [class.office-hotspot--selected]="isSelected(prop.id)"
      [style.left.%]="prop.left"
      [style.top.%]="prop.top"
      [style.width.%]="prop.width"
      [style.height.%]="prop.height"
      [attr.aria-pressed]="isSelected(prop.id)"
      [attr.aria-label]="prop.label"
      (click)="select(prop.id)"
    >
      <img class="office-hotspot__img" [src]="prop.imageSrc" [alt]="" />
    </button>
  }
</div>
